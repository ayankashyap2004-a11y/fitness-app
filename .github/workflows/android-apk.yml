name: Android APK

# Builds a signed APK and publishes it on the Releases page.
# Trigger: push a tag like v1.0.0, or run manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 / Android Gradle Plugin 8.13 need JDK 21. The runner already has the
      # Android SDK with licenses accepted.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: bash ./gradlew assembleRelease --no-daemon

      - name: Name and checksum the APK
        id: apk
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}"
          OUT="Fitness-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/release.p12"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.file }}" | head -5

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.version }}" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --title "Fitness ${{ steps.apk.outputs.version }}" \
            --notes "Android APK. Download Fitness-${{ steps.apk.outputs.version }}.apk on your phone and open it to install (allow installing from your browser if Android asks). Installing a newer version over an older one keeps your data. Data stays on the phone; back up from Settings > Backup." \
            ${{ github.ref_type == 'tag' && '' || '--target "$GITHUB_SHA"' }}
